asyncapi: 3.1.0
info:
  title: People Context Async Contract
  version: 2.0.0
  description: |
    Asynchronous event contracts for the people-context service.
    Events are published via Transactional Outbox pattern and relayed to NATS.
    All events carry metadata (eventId, occurredAt, schemaVersion) and an actorId.
    Includes Zitadel user lifecycle events (provisioned, deactivated, reactivated, password reset).
defaultContentType: application/json
servers:
  production:
    host: nats:4222
    protocol: nats
    description: NATS broker on the edge network.

# ─────────────────────────────── Channels ───────────────────────────────

channels:
  people.person.registered:
    address: people.person.registered
    messages:
      PersonRegistered:
        $ref: '#/components/messages/PersonRegistered'

  people.person.updated:
    address: people.person.updated
    messages:
      PersonUpdated:
        $ref: '#/components/messages/PersonUpdated'

  people.role.assigned:
    address: people.role.assigned
    messages:
      RoleAssigned:
        $ref: '#/components/messages/RoleAssigned'

  people.role.deactivated:
    address: people.role.deactivated
    messages:
      RoleDeactivated:
        $ref: '#/components/messages/RoleDeactivated'

  people.role.reactivated:
    address: people.role.reactivated
    messages:
      RoleReactivated:
        $ref: '#/components/messages/RoleReactivated'

  people.user.provisioned:
    address: people.user.provisioned
    messages:
      UserProvisioned:
        $ref: '#/components/messages/UserProvisioned'

  people.user.deactivated:
    address: people.user.deactivated
    messages:
      UserDeactivated:
        $ref: '#/components/messages/UserDeactivated'

  people.user.reactivated:
    address: people.user.reactivated
    messages:
      UserReactivated:
        $ref: '#/components/messages/UserReactivated'

  people.user.password_reset_requested:
    address: people.user.password_reset_requested
    messages:
      PasswordResetRequested:
        $ref: '#/components/messages/PasswordResetRequested'

# ─────────────────────────────── Operations ───────────────────────────────

operations:
  publishPersonRegistered:
    action: send
    channel:
      $ref: '#/channels/people.person.registered'
    messages:
      - $ref: '#/channels/people.person.registered/messages/PersonRegistered'

  publishPersonUpdated:
    action: send
    channel:
      $ref: '#/channels/people.person.updated'
    messages:
      - $ref: '#/channels/people.person.updated/messages/PersonUpdated'

  publishRoleAssigned:
    action: send
    channel:
      $ref: '#/channels/people.role.assigned'
    messages:
      - $ref: '#/channels/people.role.assigned/messages/RoleAssigned'

  publishRoleDeactivated:
    action: send
    channel:
      $ref: '#/channels/people.role.deactivated'
    messages:
      - $ref: '#/channels/people.role.deactivated/messages/RoleDeactivated'

  publishRoleReactivated:
    action: send
    channel:
      $ref: '#/channels/people.role.reactivated'
    messages:
      - $ref: '#/channels/people.role.reactivated/messages/RoleReactivated'

  publishUserProvisioned:
    action: send
    channel:
      $ref: '#/channels/people.user.provisioned'
    messages:
      - $ref: '#/channels/people.user.provisioned/messages/UserProvisioned'

  publishUserDeactivated:
    action: send
    channel:
      $ref: '#/channels/people.user.deactivated'
    messages:
      - $ref: '#/channels/people.user.deactivated/messages/UserDeactivated'

  publishUserReactivated:
    action: send
    channel:
      $ref: '#/channels/people.user.reactivated'
    messages:
      - $ref: '#/channels/people.user.reactivated/messages/UserReactivated'

  publishPasswordResetRequested:
    action: send
    channel:
      $ref: '#/channels/people.user.password_reset_requested'
    messages:
      - $ref: '#/channels/people.user.password_reset_requested/messages/PasswordResetRequested'

# ─────────────────────────────── Components ───────────────────────────────

components:
  messages:
    PersonRegistered:
      name: PersonRegistered
      title: Person Registered
      summary: Emitted when a new person is registered in the ACDG ecosystem.
      payload:
        $ref: ../model/schemas/PersonRegisteredEventPayload.yaml

    PersonUpdated:
      name: PersonUpdated
      title: Person Updated
      summary: Emitted when a person's identity data is updated.
      payload:
        $ref: ../model/schemas/PersonUpdatedEventPayload.yaml

    RoleAssigned:
      name: RoleAssigned
      title: Role Assigned
      summary: Emitted when a system role is assigned to a person.
      payload:
        $ref: ../model/schemas/RoleAssignedEventPayload.yaml

    RoleDeactivated:
      name: RoleDeactivated
      title: Role Deactivated
      summary: Emitted when a system role is deactivated for a person.
      payload:
        $ref: ../model/schemas/RoleDeactivatedEventPayload.yaml

    RoleReactivated:
      name: RoleReactivated
      title: Role Reactivated
      summary: Emitted when a previously deactivated system role is reactivated.
      payload:
        $ref: ../model/schemas/RoleReactivatedEventPayload.yaml

    UserProvisioned:
      name: UserProvisioned
      title: User Provisioned
      summary: Emitted when a Zitadel user is provisioned for a person.
      payload:
        $ref: ../model/schemas/UserProvisionedEventPayload.yaml

    UserDeactivated:
      name: UserDeactivated
      title: User Deactivated
      summary: Emitted when a person's Zitadel user is deactivated.
      payload:
        $ref: ../model/schemas/UserDeactivatedEventPayload.yaml

    UserReactivated:
      name: UserReactivated
      title: User Reactivated
      summary: Emitted when a person's Zitadel user is reactivated.
      payload:
        $ref: ../model/schemas/UserReactivatedEventPayload.yaml

    PasswordResetRequested:
      name: PasswordResetRequested
      title: Password Reset Requested
      summary: Emitted when a password reset is requested for a person's Zitadel user.
      payload:
        $ref: ../model/schemas/PasswordResetRequestedEventPayload.yaml
