$schema: "https://json-schema.org/draft/2020-12/schema"
title: ErrorResponse
description: |
  Error response envelope. The people-context service returns a lightweight
  error format with code and message fields.
type: object
additionalProperties: false
required:
  - success
  - error
properties:
  success:
    type: boolean
    const: false
  error:
    type: object
    additionalProperties: false
    required:
      - code
      - message
    properties:
      code:
        type: string
        description: Structured error code (e.g., PEO-001, ROL-001).
        pattern: ^[A-Z]{2,4}-\d{3}$
      message:
        type: string
        description: Human-readable error description.
