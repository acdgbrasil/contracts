$schema: "https://json-schema.org/draft/2020-12/schema"
title: WarningResponse
description: Warning entry returned when a partial failure occurs (e.g., 207 Multi-Status).
type: object
additionalProperties: false
required:
  - code
  - message
properties:
  code:
    type: string
    description: Structured warning code (e.g., ZIT-001).
    pattern: ^[A-Z]{2,4}-\d{3}$
  message:
    type: string
    description: Human-readable warning description.
