$schema: "https://json-schema.org/draft/2020-12/schema"
title: RegisterPersonRequest
description: |
  Registers a person in the ACDG ecosystem.
  If a CPF is provided and already exists, returns the existing person (idempotent dedup).
type: object
additionalProperties: false
required:
  - fullName
  - birthDate
properties:
  fullName:
    type: string
    minLength: 1
    maxLength: 200
  cpf:
    type: string
    pattern: ^\d{11}$
    description: Brazilian CPF. Used as dedup key when provided.
  birthDate:
    $ref: ./IsoDate.yaml
  email:
    type: string
    format: email
    description: Email address. Required when createLogin is true.
  createLogin:
    type: boolean
    description: When true, provisions a Zitadel user for this person. Requires email.
    default: false
  initialPassword:
    type: string
    minLength: 8
    description: Optional initial password for the Zitadel user. Change required on first login.
