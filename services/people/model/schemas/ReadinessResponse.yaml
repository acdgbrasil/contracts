$schema: "https://json-schema.org/draft/2020-12/schema"
title: ReadinessResponse
type: object
additionalProperties: false
required:
  - status
properties:
  status:
    type: string
    enum:
      - ready
      - unavailable
  checks:
    type: object
    additionalProperties: false
    description: Individual subsystem health check results.
    properties:
      database:
        type: boolean
      nats:
        type: boolean
      outbox:
        type: boolean
      outboxBacklog:
        type: integer
        minimum: 0
