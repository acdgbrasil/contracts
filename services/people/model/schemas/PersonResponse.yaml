$schema: "https://json-schema.org/draft/2020-12/schema"
title: PersonResponse
description: Person identity record.
type: object
additionalProperties: false
required:
  - id
  - fullName
  - birthDate
  - active
  - createdAt
  - updatedAt
properties:
  id:
    $ref: ./Uuid.yaml
  fullName:
    type: string
  cpf:
    type: string
    pattern: ^\d{11}$
    description: Brazilian CPF (nullable if not provided).
  birthDate:
    $ref: ./IsoDate.yaml
  email:
    type: string
    format: email
    description: Email address (nullable).
  zitadelUserId:
    type: string
    description: Zitadel user ID (nullable, set when login is provisioned).
  active:
    type: boolean
    description: Whether the person is active.
  createdAt:
    $ref: ./IsoDateTime.yaml
  updatedAt:
    $ref: ./IsoDateTime.yaml
