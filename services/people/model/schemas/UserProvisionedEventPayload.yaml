$schema: "https://json-schema.org/draft/2020-12/schema"
title: UserProvisionedEventPayload
type: object
additionalProperties: false
required:
  - metadata
  - actorId
  - data
properties:
  metadata:
    $ref: ./EventMetadata.yaml
  actorId:
    type: string
    description: ID of the actor who triggered this event.
  data:
    type: object
    additionalProperties: false
    required:
      - personId
      - zitadelUserId
      - email
    properties:
      personId:
        $ref: ./Uuid.yaml
      zitadelUserId:
        type: string
      email:
        type: string
        format: email
