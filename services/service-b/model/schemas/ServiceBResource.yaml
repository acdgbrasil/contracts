$schema: "https://json-schema.org/draft/2020-12/schema"
title: ServiceBResource
type: object
additionalProperties: false
required:
  - id
  - kind
  - createdAt
properties:
  id:
    type: string
    description: Unique identifier.
  kind:
    type: string
    enum:
      - basic
      - premium
  createdAt:
    type: string
    format: date-time
