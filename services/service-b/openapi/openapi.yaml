openapi: 3.2.0
info:
  title: Service B Sync Contract
  version: 1.0.0
  description: Synchronous APIs for service-b.
servers:
  - url: https://api.example.com/service-b
paths:
  /v1/resources/{resourceId}:
    get:
      operationId: getServiceBResourceById
      summary: Get resource by id
      parameters:
        - in: path
          name: resourceId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resource found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceBResource'
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                $ref: ../../../shared/schemas/Error.yaml
components:
  schemas:
    ServiceBResource:
      $ref: ../model/schemas/ServiceBResource.yaml
