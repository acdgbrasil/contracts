$schema: "https://json-schema.org/draft/2020-12/schema"
title: PatientArrivedEventPayload
type: object
additionalProperties: false
required:
  - metadata
  - actorId
  - data
properties:
  metadata:
    $ref: ./EventMetadata.yaml
  actorId:
    type: string
    description: ID of the actor who triggered this event.
  data:
    type: object
    additionalProperties: false
    required:
      - visitId
      - personId
    properties:
      visitId:
        $ref: ./Uuid.yaml
      personId:
        $ref: ./Uuid.yaml
