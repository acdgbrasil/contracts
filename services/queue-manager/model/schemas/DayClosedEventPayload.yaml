$schema: "https://json-schema.org/draft/2020-12/schema"
title: DayClosedEventPayload
type: object
additionalProperties: false
required:
  - metadata
  - actorId
  - data
properties:
  metadata:
    $ref: ./EventMetadata.yaml
  actorId:
    type: string
    description: ID of the actor who triggered this event.
  data:
    type: object
    additionalProperties: false
    required:
      - date
      - totalVisits
      - totalCompleted
      - totalCarryOver
    properties:
      date:
        $ref: ./IsoDate.yaml
      totalVisits:
        type: integer
        minimum: 0
      totalCompleted:
        type: integer
        minimum: 0
      totalCarryOver:
        type: integer
        minimum: 0
