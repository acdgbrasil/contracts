$schema: "https://json-schema.org/draft/2020-12/schema"
title: PatientCreatedEventPayload
description: |
  Flat event payload published by svc-social-care via NATS.
  Swift Codable serialization produces top-level camelCase fields
  with no metadata/data wrapper.
type: object
additionalProperties: false
required:
  - id
  - occurredAt
  - actorId
  - patientId
  - personId
properties:
  id:
    $ref: ./Uuid.yaml
    description: Unique event identifier (UUID).
  occurredAt:
    $ref: ./IsoDateTime.yaml
    description: Timestamp when the event occurred (ISO 8601).
  actorId:
    type: string
    description: Identifier of the actor who performed the action.
  patientId:
    $ref: ./Uuid.yaml
  personId:
    $ref: ./Uuid.yaml
