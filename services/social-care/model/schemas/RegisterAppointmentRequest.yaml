$schema: "https://json-schema.org/draft/2020-12/schema"
title: RegisterAppointmentRequest
type: object
additionalProperties: false
required:
  - professionalId
  - summary
properties:
  professionalId:
    $ref: ./UuidV7.yaml
  summary:
    type: string
    minLength: 1
    maxLength: 500
    pattern: ^.*\S.*$
  actionPlan:
    type: string
    minLength: 1
    maxLength: 2000
    pattern: ^.*\S.*$
  date:
    $ref: ./IsoDateTime.yaml
  type:
    $ref: ./SocialCareAppointmentType.yaml
