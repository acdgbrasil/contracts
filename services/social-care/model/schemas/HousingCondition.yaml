$schema: "https://json-schema.org/draft/2020-12/schema"
title: HousingCondition
type: object
additionalProperties: false
required:
  - type
  - wallMaterial
  - numberOfRooms
  - numberOfBedrooms
  - numberOfBathrooms
  - waterSupply
  - hasPipedWater
  - electricityAccess
  - sewageDisposal
  - wasteCollection
  - accessibilityLevel
  - isInGeographicRiskArea
  - hasDifficultAccess
  - isInSocialConflictArea
  - hasDiagnosticObservations
properties:
  type:
    $ref: ./HousingConditionType.yaml
  wallMaterial:
    $ref: ./WallMaterial.yaml
  numberOfRooms:
    type: integer
    minimum: 0
  numberOfBedrooms:
    type: integer
    minimum: 0
  numberOfBathrooms:
    type: integer
    minimum: 0
  waterSupply:
    $ref: ./WaterSupplyType.yaml
  hasPipedWater:
    type: boolean
  electricityAccess:
    $ref: ./ElectricityAccess.yaml
  sewageDisposal:
    $ref: ./SewageDisposalMethod.yaml
  wasteCollection:
    $ref: ./WasteCollectionType.yaml
  accessibilityLevel:
    $ref: ./AccessibilityLevel.yaml
  isInGeographicRiskArea:
    type: boolean
  hasDifficultAccess:
    type: boolean
  isInSocialConflictArea:
    type: boolean
  hasDiagnosticObservations:
    type: boolean
