$schema: "https://json-schema.org/draft/2020-12/schema"
title: PatientResponse
description: Full patient aggregate projection returned by GET endpoints.
type: object
additionalProperties: false
required:
  - patientId
  - personId
  - version
  - familyMembers
  - diagnoses
  - appointments
  - referrals
  - violationReports
  - computedAnalytics
properties:
  patientId:
    $ref: ./Uuid.yaml
  personId:
    $ref: ./Uuid.yaml
  version:
    type: integer
    minimum: 0
  personalData:
    type: object
    additionalProperties: false
    properties:
      firstName:
        type: string
      lastName:
        type: string
      motherName:
        type: string
      nationality:
        type: string
      sex:
        type: string
        enum: [male, female]
      socialName:
        type: string
      phone:
        type: string
      birthDate:
        $ref: ./IsoDate.yaml
  civilDocuments:
    type: object
    additionalProperties: false
    properties:
      cpf:
        type: string
        pattern: ^\d{11}$
      nis:
        type: string
        pattern: ^\d{11}$
      rgDocument:
        type: object
        additionalProperties: false
        properties:
          number:
            type: string
          issuingState:
            type: string
          issuingAgency:
            type: string
          issueDate:
            $ref: ./IsoDate.yaml
      cns:
        type: object
        additionalProperties: false
        description: Cartao Nacional de Saude (SUS card).
        properties:
          number:
            type: string
            description: Formatted CNS number (XXX XXXX XXXX XXXX).
          cpf:
            type: string
            description: Formatted CPF from the SUS card (XXX.XXX.XXX-XX).
          qrCode:
            type: string
            description: QR code string from the physical SUS card.
  address:
    type: object
    additionalProperties: false
    properties:
      cep:
        type: string
        pattern: ^\d{8}$
      isShelter:
        type: boolean
      isHomeless:
        type: boolean
        description: Indicates the person is homeless (situacao de rua).
      residenceLocation:
        type: string
      street:
        type: string
      neighborhood:
        type: string
      number:
        type: string
      complement:
        type: string
      state:
        type: string
      city:
        type: string
  socialIdentity:
    type: object
    additionalProperties: false
    properties:
      typeId:
        $ref: ./Uuid.yaml
      description:
        type: string
  familyMembers:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        personId:
          $ref: ./Uuid.yaml
        relationshipId:
          $ref: ./Uuid.yaml
        isPrimaryCaregiver:
          type: boolean
        residesWithPatient:
          type: boolean
        hasDisability:
          type: boolean
        requiredDocuments:
          type: array
          items:
            type: string
        birthDate:
          $ref: ./IsoDate.yaml
  diagnoses:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        icdCode:
          $ref: ./ICD10Code.yaml
        description:
          type: string
        date:
          $ref: ./IsoDate.yaml
  housingCondition:
    $ref: ./HousingCondition.yaml
  socioeconomicSituation:
    type: object
    additionalProperties: false
    properties:
      totalFamilyIncome:
        type: number
      incomePerCapita:
        type: number
      receivesSocialBenefit:
        type: boolean
      hasUnemployed:
        type: boolean
      mainSourceOfIncome:
        type: string
      socialBenefits:
        type: array
        items:
          $ref: ./SocialBenefit.yaml
  workAndIncome:
    type: object
    additionalProperties: false
    properties:
      hasRetiredMembers:
        type: boolean
      individualIncomes:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            memberId:
              $ref: ./Uuid.yaml
            occupationId:
              $ref: ./Uuid.yaml
            hasWorkCard:
              type: boolean
            monthlyAmount:
              type: number
      socialBenefits:
        type: array
        items:
          $ref: ./SocialBenefit.yaml
  educationalStatus:
    type: object
    additionalProperties: false
    properties:
      memberProfiles:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            memberId:
              $ref: ./Uuid.yaml
            canReadWrite:
              type: boolean
            attendsSchool:
              type: boolean
            educationLevelId:
              $ref: ./Uuid.yaml
      programOccurrences:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            memberId:
              $ref: ./Uuid.yaml
            date:
              $ref: ./IsoDateTime.yaml
            effectId:
              $ref: ./Uuid.yaml
            isSuspensionRequested:
              type: boolean
  healthStatus:
    type: object
    additionalProperties: false
    properties:
      foodInsecurity:
        type: boolean
      deficiencies:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            memberId:
              $ref: ./Uuid.yaml
            deficiencyTypeId:
              $ref: ./Uuid.yaml
            needsConstantCare:
              type: boolean
            responsibleCaregiverName:
              type: string
      gestatingMembers:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            memberId:
              $ref: ./Uuid.yaml
            monthsGestation:
              type: integer
              minimum: 1
              maximum: 10
            startedPrenatalCare:
              type: boolean
      constantCareNeeds:
        type: array
        items:
          type: string
  communitySupportNetwork:
    type: object
    additionalProperties: false
    properties:
      hasRelativeSupport:
        type: boolean
      hasNeighborSupport:
        type: boolean
      familyConflicts:
        type: string
      patientParticipatesInGroups:
        type: boolean
      familyParticipatesInGroups:
        type: boolean
      patientHasAccessToLeisure:
        type: boolean
      facesDiscrimination:
        type: boolean
  socialHealthSummary:
    type: object
    additionalProperties: false
    properties:
      requiresConstantCare:
        type: boolean
      hasMobilityImpairment:
        type: boolean
      functionalDependencies:
        type: array
        items:
          type: string
      hasRelevantDrugTherapy:
        type: boolean
  placementHistory:
    type: object
    additionalProperties: false
    properties:
      individualPlacements:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: ./Uuid.yaml
            memberId:
              $ref: ./Uuid.yaml
            startDate:
              $ref: ./IsoDateTime.yaml
            endDate:
              $ref: ./IsoDateTime.yaml
            reason:
              type: string
      homeLossReport:
        type: string
      thirdPartyGuardReport:
        type: string
      adultInPrison:
        type: boolean
      adolescentInInternment:
        type: boolean
  intakeInfo:
    type: object
    additionalProperties: false
    properties:
      ingressTypeId:
        $ref: ./Uuid.yaml
      originName:
        type: string
      originContact:
        type: string
      serviceReason:
        type: string
      linkedSocialPrograms:
        type: array
        items:
          type: object
          additionalProperties: false
          properties:
            programId:
              $ref: ./Uuid.yaml
            observation:
              type: string
  appointments:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: ./Uuid.yaml
        date:
          $ref: ./IsoDateTime.yaml
        professionalId:
          $ref: ./Uuid.yaml
        type:
          $ref: ./SocialCareAppointmentType.yaml
        summary:
          type: string
        actionPlan:
          type: string
  referrals:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: ./Uuid.yaml
        date:
          $ref: ./IsoDate.yaml
        professionalId:
          $ref: ./Uuid.yaml
        referredPersonId:
          $ref: ./Uuid.yaml
        destinationService:
          $ref: ./ReferralDestinationService.yaml
        reason:
          type: string
        status:
          $ref: ./ReferralStatus.yaml
  violationReports:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: ./Uuid.yaml
        reportDate:
          $ref: ./IsoDate.yaml
        incidentDate:
          $ref: ./IsoDate.yaml
        victimId:
          $ref: ./Uuid.yaml
        violationType:
          $ref: ./ViolationType.yaml
        descriptionOfFact:
          type: string
        actionsTaken:
          type: string
  computedAnalytics:
    type: object
    additionalProperties: false
    description: Server-calculated analytics based on patient data.
    properties:
      housing:
        type: object
        additionalProperties: false
        properties:
          density:
            type: number
          isOvercrowded:
            type: boolean
      financial:
        type: object
        additionalProperties: false
        properties:
          totalWorkIncome:
            type: number
          perCapitaWorkIncome:
            type: number
          totalGlobalIncome:
            type: number
          perCapitaGlobalIncome:
            type: number
      ageProfile:
        type: object
        additionalProperties: false
        properties:
          range0to6:
            type: integer
          range7to14:
            type: integer
          range15to17:
            type: integer
          range18to29:
            type: integer
          range30to59:
            type: integer
          range60to64:
            type: integer
          range65to69:
            type: integer
          range70Plus:
            type: integer
          totalMembers:
            type: integer
      educationalVulnerabilities:
        type: object
        additionalProperties: false
        properties:
          notInSchool0to5:
            type: integer
          notInSchool6to14:
            type: integer
          notInSchool15to17:
            type: integer
          illiteracy10to17:
            type: integer
          illiteracy18to59:
            type: integer
          illiteracy60Plus:
            type: integer
