$schema: "https://json-schema.org/draft/2020-12/schema"
title: PatientWithdrawnEventPayload
description: |
  Flat event payload emitted when a patient is withdrawn from the waitlist.
  Swift Codable serialization produces top-level camelCase fields.
type: object
additionalProperties: false
required:
  - id
  - occurredAt
  - actorId
  - patientId
  - personId
  - reason
properties:
  id:
    $ref: ./Uuid.yaml
    description: Unique event identifier (UUID).
  occurredAt:
    $ref: ./IsoDateTime.yaml
    description: Timestamp when the event occurred (ISO 8601).
  actorId:
    type: string
    description: Identifier of the actor who withdrew the patient.
  patientId:
    $ref: ./Uuid.yaml
  personId:
    $ref: ./Uuid.yaml
  reason:
    type: string
  notes:
    type: string
