$schema: "https://json-schema.org/draft/2020-12/schema"
title: RegisterPatientRequest
type: object
additionalProperties: false
required:
  - personId
  - initialDiagnoses
  - prRelationshipId
properties:
  personId:
    $ref: ./Uuid.yaml
    description: Person unique identifier (UUID).
  initialDiagnoses:
    type: array
    minItems: 1
    maxItems: 100
    items:
      $ref: ./InitialDiagnosis.yaml
  prRelationshipId:
    $ref: ./Uuid.yaml
    description: Lookup ID for the reference person relationship (dominio_parentesco).
  personalData:
    type: object
    additionalProperties: false
    required:
      - firstName
      - lastName
      - motherName
      - nationality
      - sex
      - birthDate
    properties:
      firstName:
        type: string
        minLength: 1
      lastName:
        type: string
        minLength: 1
      motherName:
        type: string
        minLength: 1
      nationality:
        type: string
        minLength: 1
      sex:
        type: string
        enum: [masculino, feminino, outro]
      socialName:
        type: string
      birthDate:
        $ref: ./IsoDate.yaml
      phone:
        type: string
  civilDocuments:
    type: object
    additionalProperties: false
    properties:
      cpf:
        type: string
        pattern: ^\d{11}$
      nis:
        type: string
        pattern: ^\d{11}$
      rgDocument:
        type: object
        additionalProperties: false
        required:
          - number
          - issuingState
          - issuingAgency
          - issueDate
        properties:
          number:
            type: string
          issuingState:
            type: string
          issuingAgency:
            type: string
          issueDate:
            $ref: ./IsoDate.yaml
      cns:
        type: object
        additionalProperties: false
        description: Cartao Nacional de Saude (SUS card).
        required:
          - number
          - cpf
        properties:
          number:
            $ref: ./CNSNumber.yaml
          cpf:
            type: string
            pattern: ^\d{11}$
            description: CPF printed on the SUS card. Must match civilDocuments.cpf when both are provided.
          qrCode:
            type: string
            description: QR code string from the physical SUS card (optional).
  address:
    type: object
    additionalProperties: false
    required:
      - isShelter
      - residenceLocation
      - state
      - city
    properties:
      cep:
        type: string
        pattern: ^\d{8}$
      isShelter:
        type: boolean
      isHomeless:
        type: boolean
        default: false
        description: Indicates the person is homeless (situacao de rua). State and city remain required for territorial coverage (CRAS reference).
      residenceLocation:
        type: string
      street:
        type: string
      neighborhood:
        type: string
      number:
        type: string
      complement:
        type: string
      state:
        type: string
      city:
        type: string
  socialIdentity:
    type: object
    additionalProperties: false
    required:
      - typeId
    properties:
      typeId:
        $ref: ./Uuid.yaml
        description: Lookup ID for social identity type (dominio_tipo_identidade).
      description:
        type: string
        maxLength: 500
