$schema: "https://json-schema.org/draft/2020-12/schema"
title: RightsViolationReportedEventPayload
type: object
additionalProperties: false
required:
  - metadata
  - data
properties:
  metadata:
    $ref: ./EventMetadata.yaml
  data:
    type: object
    additionalProperties: false
    required:
      - patientId
      - reportId
      - victimId
      - violationType
    properties:
      patientId:
        $ref: ./Uuid.yaml
      reportId:
        $ref: ./Uuid.yaml
      victimId:
        $ref: ./Uuid.yaml
      violationType:
        $ref: ./ViolationType.yaml
