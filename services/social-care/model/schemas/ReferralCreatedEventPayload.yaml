$schema: "https://json-schema.org/draft/2020-12/schema"
title: ReferralCreatedEventPayload
type: object
additionalProperties: false
required:
  - metadata
  - data
properties:
  metadata:
    $ref: ./EventMetadata.yaml
  data:
    type: object
    additionalProperties: false
    required:
      - patientId
      - referralId
      - referredPersonId
      - destinationService
      - status
    properties:
      patientId:
        $ref: ./Uuid.yaml
      referralId:
        $ref: ./Uuid.yaml
      referredPersonId:
        $ref: ./Uuid.yaml
      destinationService:
        $ref: ./ReferralDestinationService.yaml
      status:
        $ref: ./ReferralStatus.yaml
