$schema: "https://json-schema.org/draft/2020-12/schema"
title: ReferralCreatedEventPayload
description: |
  Flat event payload published when a referral is created.
  Swift Codable serialization produces top-level camelCase fields.
type: object
additionalProperties: false
required:
  - id
  - occurredAt
  - actorId
  - patientId
  - referralId
  - referredPersonId
  - destinationService
  - status
properties:
  id:
    $ref: ./Uuid.yaml
    description: Unique event identifier (UUID).
  occurredAt:
    $ref: ./IsoDateTime.yaml
    description: Timestamp when the event occurred (ISO 8601).
  actorId:
    type: string
    description: Identifier of the actor who performed the action.
  patientId:
    $ref: ./Uuid.yaml
  referralId:
    $ref: ./Uuid.yaml
  referredPersonId:
    $ref: ./Uuid.yaml
  destinationService:
    $ref: ./ReferralDestinationService.yaml
  status:
    $ref: ./ReferralStatus.yaml
