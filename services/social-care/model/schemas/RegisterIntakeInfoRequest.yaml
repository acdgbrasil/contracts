$schema: "https://json-schema.org/draft/2020-12/schema"
title: RegisterIntakeInfoRequest
type: object
additionalProperties: false
required:
  - ingressTypeId
  - serviceReason
  - linkedSocialPrograms
properties:
  ingressTypeId:
    $ref: ./Uuid.yaml
    description: Lookup ID for ingress type (dominio_tipo_ingresso).
  originName:
    type: string
    maxLength: 200
  originContact:
    type: string
    maxLength: 200
  serviceReason:
    type: string
    minLength: 1
    maxLength: 2000
    pattern: ^.*\S.*$
  linkedSocialPrograms:
    type: array
    items:
      type: object
      additionalProperties: false
      required:
        - programId
      properties:
        programId:
          $ref: ./Uuid.yaml
          description: Lookup ID for social program (dominio_programa_social).
        observation:
          type: string
          maxLength: 500
