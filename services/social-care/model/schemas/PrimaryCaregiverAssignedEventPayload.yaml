$schema: "https://json-schema.org/draft/2020-12/schema"
title: PrimaryCaregiverAssignedEventPayload
description: |
  Flat event payload published when a primary caregiver is assigned.
  Swift Codable serialization produces top-level camelCase fields.
type: object
additionalProperties: false
required:
  - id
  - occurredAt
  - actorId
  - patientId
  - caregiverId
properties:
  id:
    $ref: ./Uuid.yaml
    description: Unique event identifier (UUID).
  occurredAt:
    $ref: ./IsoDateTime.yaml
    description: Timestamp when the event occurred (ISO 8601).
  actorId:
    type: string
    description: Identifier of the actor who performed the action.
  patientId:
    $ref: ./Uuid.yaml
  caregiverId:
    $ref: ./Uuid.yaml
