$schema: "https://json-schema.org/draft/2020-12/schema"
title: AddFamilyMemberRequest
type: object
additionalProperties: false
required:
  - memberPersonId
  - relationship
  - isResiding
  - isCaregiver
  - hasDisability
  - requiredDocuments
  - birthDate
  - prRelationshipId
properties:
  memberPersonId:
    $ref: ./Uuid.yaml
  relationship:
    type: string
    minLength: 1
    maxLength: 120
    pattern: ^.*\S.*$
  isResiding:
    type: boolean
  isCaregiver:
    type: boolean
  hasDisability:
    type: boolean
  requiredDocuments:
    type: array
    items:
      type: string
  birthDate:
    $ref: ./IsoDate.yaml
  prRelationshipId:
    $ref: ./Uuid.yaml
    description: Lookup ID for relationship type (dominio_parentesco).
