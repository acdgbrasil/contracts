$schema: "https://json-schema.org/draft/2020-12/schema"
title: AddFamilyMemberRequest
type: object
additionalProperties: false
required:
  - memberPersonId
  - relationship
  - isResiding
  - isCaregiver
properties:
  memberPersonId:
    $ref: ./UuidV7.yaml
  relationship:
    type: string
    minLength: 1
    maxLength: 120
    pattern: ^.*\S.*$
  isResiding:
    type: boolean
  isCaregiver:
    type: boolean
