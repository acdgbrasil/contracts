$schema: "https://json-schema.org/draft/2020-12/schema"
title: ReportRightsViolationRequest
type: object
additionalProperties: false
required:
  - victimId
  - violationType
  - descriptionOfFact
properties:
  victimId:
    $ref: ./Uuid.yaml
  violationType:
    $ref: ./ViolationType.yaml
  violationTypeId:
    $ref: ./Uuid.yaml
    description: Lookup ID for violation type (dominio_tipo_violacao).
  reportDate:
    $ref: ./IsoDate.yaml
  incidentDate:
    $ref: ./IsoDate.yaml
  descriptionOfFact:
    type: string
    minLength: 1
    maxLength: 5000
    pattern: ^.*\S.*$
  actionsTaken:
    type: string
    maxLength: 5000
