$schema: "https://json-schema.org/draft/2020-12/schema"
title: DischargePatientRequest
description: Request to discharge a patient from active care.
type: object
additionalProperties: false
required:
  - reason
properties:
  reason:
    type: string
    minLength: 1
    description: Reason for discharge.
  notes:
    type: string
    description: Optional additional notes about the discharge.
