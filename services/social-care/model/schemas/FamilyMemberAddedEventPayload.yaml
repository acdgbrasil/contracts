$schema: "https://json-schema.org/draft/2020-12/schema"
title: FamilyMemberAddedEventPayload
type: object
additionalProperties: false
required:
  - metadata
  - data
properties:
  metadata:
    $ref: ./EventMetadata.yaml
  data:
    type: object
    additionalProperties: false
    required:
      - patientId
      - memberId
      - relationship
    properties:
      patientId:
        $ref: ./UuidV7.yaml
      memberId:
        $ref: ./UuidV7.yaml
      relationship:
        type: string
        minLength: 1
        maxLength: 120
        pattern: ^.*\S.*$
