asyncapi: 3.0.0
info:
  title: Service C Async Contract
  version: 1.0.0
  description: Asynchronous events for service-c.
defaultContentType: application/json
servers:
  production:
    host: broker.example.com
    protocol: kafka
channels:
  service-c.resource.deleted:
    address: service-c.resource.deleted
    messages:
      ServiceCResourceDeleted:
        $ref: '#/components/messages/ServiceCResourceDeleted'
operations:
  publishServiceCResourceDeleted:
    action: send
    channel:
      $ref: '#/channels/service-c.resource.deleted'
    messages:
      - $ref: '#/channels/service-c.resource.deleted/messages/ServiceCResourceDeleted'
components:
  messages:
    ServiceCResourceDeleted:
      name: ServiceCResourceDeleted
      title: Service C Resource Deleted
      payload:
        $ref: ../model/schemas/ServiceCResource.yaml
