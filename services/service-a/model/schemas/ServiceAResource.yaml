$schema: "https://json-schema.org/draft/2020-12/schema"
title: ServiceAResource
type: object
additionalProperties: false
required:
  - id
  - status
  - createdAt
properties:
  id:
    type: string
    description: Unique identifier.
  status:
    type: string
    enum:
      - pending
      - active
      - archived
  createdAt:
    type: string
    format: date-time
