$schema: "https://json-schema.org/draft/2020-12/schema"
title: DatasetMetadata
description: Metadata describing an available indicator dataset.
type: object
additionalProperties: false
required:
  - name
  - description
properties:
  name:
    type: string
    description: Machine-readable dataset name (e.g., demographics, epidemiological).
  description:
    type: string
    description: Human-readable description of the dataset contents.
