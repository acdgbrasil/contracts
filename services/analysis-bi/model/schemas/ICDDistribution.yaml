$schema: "https://json-schema.org/draft/2020-12/schema"
title: ICDDistribution
description: Frequency distribution of an ICD-10 diagnosis code.
type: object
additionalProperties: false
required:
  - code
  - description
  - count
  - percentage
properties:
  code:
    type: string
    description: ICD-10 code (e.g., "Q90.0").
  description:
    type: string
    description: Human-readable diagnosis description.
  count:
    type: integer
    minimum: 0
    description: Absolute number of occurrences.
  percentage:
    type: number
    minimum: 0
    maximum: 100
    description: Relative frequency as a percentage of total diagnoses.
