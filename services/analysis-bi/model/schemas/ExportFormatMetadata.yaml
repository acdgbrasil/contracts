$schema: "https://json-schema.org/draft/2020-12/schema"
title: ExportFormatMetadata
description: Metadata about a supported export file format.
type: object
additionalProperties: false
required:
  - name
  - content_type
  - extension
properties:
  name:
    type: string
    description: "Format identifier (e.g., csv, json, parquet)."
  content_type:
    type: string
    description: "MIME type for Content-Type header (e.g., text/csv, application/json)."
  extension:
    type: string
    description: "File extension without dot (e.g., csv, json, parquet)."
