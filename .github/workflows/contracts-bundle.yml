name: Contracts CI and Bundle Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (example: v1.2.3). Required on manual runs."
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Lint OpenAPI specs
        run: |
          set -euo pipefail
          files=$(find services -type f -path '*/openapi/*.yaml' | sort)
          if [ -z "$files" ]; then
            echo "No OpenAPI files found."
            exit 0
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Linting $file"
            npx --yes @redocly/cli@latest lint --config .redocly.yaml "$file"
          done <<< "$files"

      - name: Validate AsyncAPI specs
        run: |
          set -euo pipefail
          files=$(find services -type f -path '*/asyncapi/*.yaml' | sort)
          if [ -z "$files" ]; then
            echo "No AsyncAPI files found."
            exit 0
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            echo "Validating $file"
            npx --yes @asyncapi/cli@latest validate "$file"
          done <<< "$files"

  publish:
    name: Publish contracts bundle to GHCR
    runs-on: ubuntu-latest
    needs:
      - validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve version and image coordinates
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            echo "Manual publish requires input 'version'."
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must match vMAJOR.MINOR.PATCH. Got: $VERSION"
            exit 1
          fi

          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(basename "${GITHUB_REPOSITORY}")
          IMAGE="ghcr.io/${OWNER_LC}/${REPO_NAME}"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Create contracts bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE="dist/contracts-${{ steps.meta.outputs.version }}.tgz"
          tar -czf "$BUNDLE" README.md services shared
          sha256sum "$BUNDLE" > "$BUNDLE.sha256"

      - name: Setup ORAS
        uses: oras-project/setup-oras@38de303aac69abb66f3e6255b7198bff35f323e3 # v2.0.0

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push OCI artifact (version and sha tags)
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="dist/contracts-${{ steps.meta.outputs.version }}.tgz"
          MEDIA_TYPE="application/vnd.acdg.contracts.bundle.layer.v1.tar+gzip"
          ARTIFACT_TYPE="application/vnd.acdg.contracts.bundle.v1"

          oras push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            --artifact-type "$ARTIFACT_TYPE" \
            "$BUNDLE:$MEDIA_TYPE" \
            --annotation "org.opencontainers.image.title=acdg-contracts" \
            --annotation "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}"

          oras push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha_tag }}" \
            --artifact-type "$ARTIFACT_TYPE" \
            "$BUNDLE:$MEDIA_TYPE" \
            --annotation "org.opencontainers.image.title=acdg-contracts" \
            --annotation "org.opencontainers.image.version=${{ steps.meta.outputs.version }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}"

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## Contracts bundle published"
            echo ""
            echo "- Image: \`${{ steps.meta.outputs.image }}\`"
            echo "- Tags: \`${{ steps.meta.outputs.version }}\`, \`${{ steps.meta.outputs.sha_tag }}\`"
            echo ""
            echo "Pull example:"
            echo "\`oras pull ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
