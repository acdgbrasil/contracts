$schema: "https://json-schema.org/draft/2020-12/schema"
title: Error
type: object
additionalProperties: false
required:
  - id
  - code
  - message
  - bc
  - module
  - kind
  - context
  - safeContext
  - observability
properties:
  id:
    type: string
    description: Unique error identifier generated when the error is created.
  code:
    type: string
    description: "Stable, support-facing error code (example: PAT-001)."
  message:
    type: string
    description: Final user-facing error message.
  bc:
    type: string
    description: Bounded context where the error originated.
  module:
    type: string
    description: Module or subdomain where the error originated.
  kind:
    type: string
    description: Specific error kind inside the module catalog.
  context:
    type: object
    additionalProperties: true
    description: Raw contextual data captured at error creation.
  safeContext:
    type: object
    additionalProperties: true
    description: Sanitized context safe for external logs and responses.
  observability:
    type: object
    additionalProperties: false
    required:
      - category
      - severity
      - fingerprint
      - tags
    properties:
      category:
        type: string
        enum:
          - DOMAIN_RULE_VIOLATION
          - EXTERNAL_API_FAILURE
          - EXTERNAL_CONTRACT_MISMATCH
          - CROSS_LAYER_COMMUNICATION_FAILURE
          - DATA_CONSISTENCY_INCIDENT
          - SECURITY_BOUNDARY_VIOLATION
          - INFRASTRUCTURE_DEPENDENCY_FAILURE
          - OBSERVABILITY_PIPELINE_FAILURE
          - UNEXPECTED_SYSTEM_STATE
          - CONFLICT
      severity:
        type: string
        enum:
          - DEBUG
          - INFO
          - WARNING
          - ERROR
          - CRITICAL
      fingerprint:
        type: array
        minItems: 1
        items:
          type: string
      tags:
        type: object
        additionalProperties:
          type: string
  http:
    type: integer
    minimum: 100
    maximum: 599
    description: Suggested HTTP status for delivery layers.
  stackTrace:
    type: string
    description: Original stack trace when available.
  cause:
    description: Root cause associated with this error.
