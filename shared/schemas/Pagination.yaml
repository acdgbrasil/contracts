$schema: "https://json-schema.org/draft/2020-12/schema"
title: Pagination
type: object
additionalProperties: false
required:
  - page
  - pageSize
  - totalItems
properties:
  page:
    type: integer
    minimum: 1
  pageSize:
    type: integer
    minimum: 1
  totalItems:
    type: integer
    minimum: 0
