$schema: "https://json-schema.org/draft/2020-12/schema"
title: CursorPagination
description: Cursor-based pagination metadata for list endpoints.
type: object
additionalProperties: false
required:
  - timestamp
  - pageSize
  - totalCount
  - hasMore
properties:
  timestamp:
    type: string
    format: date-time
    description: Server-side response timestamp (ISO 8601).
  pageSize:
    type: integer
    minimum: 1
    maximum: 100
    description: Number of items per page (as requested).
  totalCount:
    type: integer
    minimum: 0
    description: Total number of items matching the query (including filtered results).
  hasMore:
    type: boolean
    description: Whether there are more pages available after this one.
  nextCursor:
    type: string
    format: uuid
    nullable: true
    description: Cursor (UUID) for fetching the next page. Null when hasMore is false.
